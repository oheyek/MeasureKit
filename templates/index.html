{% extends "base.html" %}
{% block head %}{% endblock %}
{% block body %}
    <div id="main-container">
        <h1>MeasureKit</h1>
        <h2>SELECT UNITS CATEGORY:</h2>
        <div id="category-buttons">
            <form method="post" action="/">
                <div id="temperature-button">
                    <button name="action" value="temperature" type="submit">TEMPERATURE</button>
                </div>
                <div id="length-button">
                    <button name="action" value="length" type="submit">LENGTH</button>
                </div>
                <div id="weight-button">
                    <button name="action" value="weight" type="submit">WEIGHT</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
